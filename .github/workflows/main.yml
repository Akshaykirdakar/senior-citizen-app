name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Create Android platform
        run: flutter create --platforms=android .

      - name: Configure Android desugaring
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle.kts")
          text = path.read_text()

          # Enable core library desugaring
          if "isCoreLibraryDesugaringEnabled = true" not in text:
              text = text.replace(
                  "compileOptions {",
                  """compileOptions {
                      isCoreLibraryDesugaringEnabled = true"""
              )

          # Add the required desugaring dependency
          dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'

          if dependency not in text:
              match = re.search(r"dependencies\s*\{", text)

              if match:
                  insert_at = match.end()
                  text = (
                      text[:insert_at]
                      + "\n    "
                      + dependency
                      + text[insert_at:]
                  )
              else:
                  text += f"""

          dependencies {{
              {dependency}
          }}
          """

          path.write_text(text)

          print("===== FINAL android/app/build.gradle.kts =====")
          print(text)
          print("===== END android/app/build.gradle.kts =====")
          PY

      - name: Verify desugaring configuration
        run: |
          echo "Checking desugaring configuration..."
          grep -n "isCoreLibraryDesugaringEnabled" android/app/build.gradle.kts
          grep -n "coreLibraryDesugaring" android/app/build.gradle.kts

      - name: Get Flutter packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: senior-citizen-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
